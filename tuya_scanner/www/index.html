[data-theme="dark"] {

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:var(--fs);line-height:1.6}

.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.top-left{display:flex;align-items:center;gap:10px}
.lang-select,.theme-toggle{padding:7px 12px;border-radius:8px;font-size:.9rem;font-weight:600;border:1.5px solid var(--bdr2);background:var(--bg);color:var(--txt);cursor:pointer}
.credits{font-size:.85rem;color:var(--gray)}
.credits a{color:var(--blue);text-decoration:none}

.wrap{max-width:none;width:100%;margin:0;padding:16px 18px 40px}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 14px rgba(13,148,136,.35);background:linear-gradient(135deg,#0d9488,#22d3ee)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.header-title{font-size:1.45rem;font-weight:800;color:var(--txt);letter-spacing:-.03em}
.header-sub{font-size:.95rem;color:var(--gray);margin-top:2px}
.header-badge{background:var(--accent);color:#fff;border-radius:6px;padding:5px 12px;font-size:.8rem;font-weight:600}
