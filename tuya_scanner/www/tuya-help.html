  <h1>Tuya IoT — where to copy Access ID / Secret</h1>
  <ol>
    <li>Open <a href="https://iot.tuya.com/">iot.tuya.com</a></li>
    <li>Cloud → Project Management → Open Project</li>
    <li>Overview → Authorization Key → copy <strong>Access ID</strong> and <strong>Access Secret</strong></li>
  </ol>
