<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Tuya Cloud Overview Access ID Secret">
  <defs>
    <linearGradient id="tuyaHelpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#tuyaHelpBg)"/>
  <text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">iot.tuya.com - Cloud project - Overview</text>
  <text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Copy Access ID / Client ID and Access Secret / Client Secret</text>

  <rect x="40" y="110" width="880" height="380" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="110" width="220" height="380" rx="16" fill="#1e293b"/>
  <text x="60" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">CLOUD</text>
  <text x="60" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">Development</text>
  <text x="60" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cbd5e1">Cloud Services</text>
  <text x="60" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cbd5e1">Devices</text>

  <text x="290" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Project Overview</text>
  <rect x="290" y="180" width="580" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="310" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d4ed8">Authorization Key</text>
  <text x="310" y="245" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">Access ID / Client ID</text>
  <text x="310" y="275" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">Access Secret / Client Secret</text>
  <polygon points="250,240 285,220 285,260" fill="#2563eb"/>

  <rect x="290" y="320" width="280" height="130" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="310" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Also required</text>
  <text x="310" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#065f46">1. Devices - Link Tuya App Account</text>
  <text x="310" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#065f46">2. IoT Core active (Extend trial)</text>

  <rect x="590" y="320" width="280" height="130" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="610" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309">In this add-on</text>
  <text x="610" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">Paste Client ID + Secret</text>
  <text x="610" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">Choose Region (eu / eu-w)</text>
</svg>
